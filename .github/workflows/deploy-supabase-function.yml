name: Deploy Supabase Upload Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment settings
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Add repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [[ -z "$PROJECT_REF" ]]; then
            echo "::error::Add repository variable SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy upload-report
        run: |
          supabase functions deploy upload-report \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
